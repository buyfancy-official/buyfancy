<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f8f9fa; color: #333; }
    
    /* Header & Navigation */
    header { background: #111827; color: white; text-align: center; padding: 25px 15px; }
    header h1 { font-size: 2rem; margin-bottom: 5px; color: #f97316; }
    header p { font-size: 0.95rem; color: #9ca3af; }

    /* Product Grid Layout */
    .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }

    /* Product Card Styling */
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 230px; object-fit: cover; }
    .card-body { padding: 18px; text-align: center; }
    .card-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; color: #1f2937; }
    .card-price { font-size: 1.25rem; font-weight: bold; color: #16a34a; margin-bottom: 15px; }

    /* WhatsApp Button */
    .btn-whatsapp { display: inline-block; width: 100%; background: #25D366; color: white; font-weight: bold; padding: 12px 0; border-radius: 8px; text-decoration: none; transition: background 0.3s; }
    .btn-whatsapp:hover { background: #1eb954; }

    /* Footer */
    footer { text-align: center; padding: 20px; font-size: 0.85rem; color: #6b7280; margin-top: 40px; }
  </style>
</head>
